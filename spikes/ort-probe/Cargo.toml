# Stage 0 probe: checks that HTDemucs ONNX exports run through `ort` on CPU
# and DirectML on the target machine. Standalone package, not part of the app.
[package]
name = "ort-probe"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-native", "api-27", "directml"] }
realfft = "3.5"
thiserror = "2"

[profile.release]
debug = false

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
get_unwrap = "deny"
unwrap_in_result = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
exit = "deny"
let_underscore_must_use = "deny"
dbg_macro = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
