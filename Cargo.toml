[workspace]
resolver = "3"
members = ["crates/core", "crates/app"]
# Standalone experiments with their own dependencies and lock files.
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
stem-split-core = { path = "crates/core" }
# The glow (OpenGL) renderer instead of the default wgpu: for a form-like UI it
# halves the binary and uses a fraction of the memory. See docs/ARCHITECTURE.md.
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    # Keeps the window position and the settings between launches.
    "persistence",
    "wayland",
    "x11",
] }
directories = "6"
hex-literal = "1"
hound = "3.5"
log = "0.4"
# Still a release candidate, so the version is pinned exactly. ONNX Runtime is
# downloaded at build time and linked statically; `copy-dylibs` places the
# DirectML library next to the binaries. The `directml` feature is added for
# Windows in crates/core/Cargo.toml.
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    "api-27",
    "copy-dylibs",
    "download-binaries",
    "std",
    "tls-rustls",
] }
# Not used from code. Depending on it directly makes Cargo run its build
# script, which downloads DirectML.dll, before the build script of the core
# crate, which copies that file next to test and example binaries.
open = "5"
ort-sys = { version = "=2.0.0-rc.13", default-features = false }
realfft = "3.5"
rfd = "0.17"
rubato = "5"
sha2 = "0.11"
sys-locale = "0.3"
# Only the containers and codecs behind `AudioFormat`; the default set lacks
# MP3 and AAC and brings formats the application does not offer.
symphonia = { version = "0.6", default-features = false, features = [
    "aac",
    "alac",
    "all-meta",
    "flac",
    "isomp4",
    "mp3",
    "ogg",
    "opt-simd",
    "pcm",
    "vorbis",
    "wav",
] }
tempfile = "3"
thiserror = "2"
winresource = "0.1"
# rustls with the operating system's certificate verifier: self-contained to
# build, yet honours certificates installed on the machine. No gzip: the
# only downloads are binary model files.
ureq = { version = "3", default-features = false, features = [
    "platform-verifier",
    "rustls",
] }

# Enforced project rules, see docs/GUIDELINES.md.
[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# No panics: every fallible operation goes through `Result`/`Option`.
unwrap_used = "deny"
expect_used = "deny"
get_unwrap = "deny"
unwrap_in_result = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
exit = "deny"
# No silently dropped errors, no leftover debugging.
let_underscore_must_use = "deny"
dbg_macro = "deny"
# Lint exceptions must be `#[expect(.., reason = "..")]`, never a bare `#[allow]`.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
