[package]
name = "stem-split"
version = "0.1.0"
edition = "2024"

[dependencies]

# Enforced project rules, see docs/GUIDELINES.md.
[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# No panics: every fallible operation goes through `Result`/`Option`.
unwrap_used = "deny"
expect_used = "deny"
get_unwrap = "deny"
unwrap_in_result = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
exit = "deny"
# No silently dropped errors, no leftover debugging.
let_underscore_must_use = "deny"
dbg_macro = "deny"
# Lint exceptions must be `#[expect(.., reason = "..")]`, never a bare `#[allow]`.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
